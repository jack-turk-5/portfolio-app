name: Release and Publish Image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/jack-turk-5/portfolio-app
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for cross-arch builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-arch image
        run: |
          podman build \
            --platform ${{ env.PLATFORMS }} \
            --manifest portfolio-app \
            -f Containerfile .

      - name: Push manifest to GHCR
        run: |
          for TAG in latest "${{ github.event.release.tag_name }}" "${{ github.sha }}"; do
            podman manifest push --all portfolio-app "docker://${{ env.IMAGE_NAME }}:$TAG"
          done
