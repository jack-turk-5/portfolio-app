name: Release and Publish Image

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/jack-turk-5/portfolio-app
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Sync project versions to release tag
        id: version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          NPM_VERSION=$(jq -r .version package.json)
          UV_VERSION=$(uv version --short --project backend)
          echo "Tag: $VERSION, package.json: $NPM_VERSION, pyproject.toml: $UV_VERSION"
          if [ "$NPM_VERSION" != "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi
          if [ "$UV_VERSION" != "$VERSION" ]; then
            uv version "$VERSION" --project backend
          fi
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for cross-arch builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-arch image
        run: |
          podman manifest create portfolio-app
          for PLATFORM in ${PLATFORMS//,/ }; do
            podman build \
              --platform "$PLATFORM" \
              --manifest portfolio-app \
              -f Containerfile .
          done

      - name: Verify manifest contains every platform
        run: |
          podman manifest inspect portfolio-app
          for PLATFORM in ${PLATFORMS//,/ }; do
            ARCH="${PLATFORM#*/}"
            podman manifest inspect portfolio-app \
              | jq -e --arg arch "$ARCH" '.manifests[] | select(.platform.architecture == $arch)' > /dev/null \
              || { echo "Missing $PLATFORM in manifest"; exit 1; }
          done

      - name: Push manifest to GHCR
        run: |
          for TAG in latest "${{ github.event.release.tag_name }}" "${{ github.sha }}"; do
            podman manifest push --all portfolio-app "docker://${{ env.IMAGE_NAME }}:$TAG"
          done

      - name: Commit version bump back to the release branch
        if: steps.version.outputs.changed == 'true'
        run: |
          BRANCH="${{ github.event.release.target_commitish }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "bump version to ${{ steps.version.outputs.version }}"
          git push origin "HEAD:refs/heads/$BRANCH" \
            || echo "::warning::Could not push version bump to $BRANCH; bump it manually."
